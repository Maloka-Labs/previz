name: Contribution harness

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contribution-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test shared contribution checks
        run: python3 -m unittest discover -s tools/contribution-harness -p 'test_*.py' -v
      - name: Validate contribution changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="origin/$DEFAULT_BRANCH"
          fi
          python3 tools/contribution-harness/check.py --base "$BASE_SHA"
